stages:
  - build-and-push
  - deploy

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "842549707720"
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  ECS_CLUSTER: "buildtrack-cluster"

# ── Build and Push Docker Images ───────────────────
build_and_push:
  stage: build-and-push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    # Install AWS CLI inside the runner to authenticate with ECR
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    # Build & Push NestJS API
    - echo "Building API Image..."
    - docker build -t buildtrack-api ./apps/api
    - docker tag buildtrack-api:latest $ECR_REGISTRY/buildtrack-api:latest
    - docker push $ECR_REGISTRY/buildtrack-api:latest

    # Build & Push Next.js Web
    - echo "Building Web Image..."
    - docker build -t buildtrack-web ./apps/web
    - docker tag buildtrack-web:latest $ECR_REGISTRY/buildtrack-web:latest
    - docker push $ECR_REGISTRY/buildtrack-web:latest
  only:
    - main  # Runs only when code is merged/pushed to main branch

# ── Deploy to Amazon ECS ───────────────────────────
deploy_to_ecs:
  stage: deploy
  image: amazon/aws-cli:latest
  script:
    - echo "Triggering rolling deployment on ECS cluster..."
    - aws ecs update-service --cluster $ECS_CLUSTER --service buildtrack-api-service --force-new-deployment
    - aws ecs update-service --cluster $ECS_CLUSTER --service buildtrack-web-service --force-new-deployment
  only:
    - main

# ============================================
# BuildTrack — Production Docker Compose
# ============================================

services:
  # ── Reverse Proxy ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: buildtrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - buildtrack-network

  # ── Frontend (Next.js) ──────────────────────
  web:
    image: yanushka101/build-rack:web-${IMAGE_TAG:-latest}
    container_name: buildtrack-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}/api/v1
      - NEXT_PUBLIC_APP_NAME=${APP_NAME:-BuildTrack}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - buildtrack-network

  # ── Backend (NestJS) ────────────────────────
  api:
    image: yanushka101/build-rack:api-${IMAGE_TAG:-latest}
    container_name: buildtrack-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-buildtrack-storage}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-BuildTrack}
      - WHATSAPP_ACCOUNT_SID=${WHATSAPP_ACCOUNT_SID:-}
      - WHATSAPP_AUTH_TOKEN=${WHATSAPP_AUTH_TOKEN:-}
      - WHATSAPP_FROM=${WHATSAPP_FROM:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - THROTTLE_TTL=${THROTTLE_TTL:-60}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - buildtrack-network

  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: buildtrack-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-buildtrack}
      - POSTGRES_USER=${DB_USER:-buildtrack}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-buildtrack} -d ${DB_NAME:-buildtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildtrack-network

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: buildtrack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildtrack-network

  # ── MinIO (S3-Compatible Storage) ──────────
  minio:
    image: minio/minio:latest
    container_name: buildtrack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - buildtrack-network

  # ── Prometheus ──────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: buildtrack-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - buildtrack-network

  # ── Grafana ─────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: buildtrack-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - buildtrack-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  prometheusdata:
    driver: local
  grafanadata:
    driver: local

networks:
  buildtrack-network:
    driver: bridge

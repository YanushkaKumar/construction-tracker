name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  DOCKERHUB_REPO: 'yanushka101/build-rack'


jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      # Lint is advisory for now: the web app carries ~300 pre-existing
      # no-explicit-any / unused-var findings. Drop the `|| true` once those
      # are cleared so new ones can't slip in.
      - run: npm run lint || true
      # Type errors DO fail the build — all three workspaces are clean today,
      # so anything that breaks here is new.
      - run: npm run type-check

  test-api:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buildtrack_test
          POSTGRES_USER: buildtrack
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://buildtrack:test_password@localhost:5432/buildtrack_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma@6.14.0 db push --schema=apps/api/prisma/schema
      - run: npm run test --workspace=apps/api -- --passWithNoTests

  test-web:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspace=apps/web --if-present

   
      
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - run: npm run build -- --if-present

  push-images:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:api-latest
            ${{ env.DOCKERHUB_REPO }}:api-${{ github.sha }}
            

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:web-latest
            ${{ env.DOCKERHUB_REPO }}:web-${{ github.sha }}


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-images
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Copy Docker Compose and Nginx configs to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,infra/nginx/conf.d/default.conf,infra/postgres/init.sql,infra/prometheus/prometheus.yml,infra/grafana/dashboards/buildtrack.json"
          target: "/home/${{ secrets.EC2_USER }}/buildtrack"

      - name: Deploy services on EC2 via SSH
        uses: appleboy/ssh-action@master
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_ENV_FILE_B64: ${{ secrets.PROD_ENV_FILE_B64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,PROD_ENV_FILE_B64
          script: |
            set -euo pipefail
            cd /home/${{ secrets.EC2_USER }}/buildtrack
            # Log in to Docker Hub to access private images
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # ── Environment file ────────────────────────────────────────
            # The whole .env is kept in the PROD_ENV_FILE_B64 repository
            # secret (base64 of the complete file, so multi-line content and
            # special characters survive the trip over SSH). Rewriting it on
            # every deploy means the server's config can't quietly drift from
            # what's in the secret, and a rebuilt host comes back configured.
            #
            # To change any variable: edit the file, re-run `base64 -w0 .env`,
            # and update the secret. Do NOT hand-edit .env on the server, it
            # will be overwritten on the next deploy.
            if [ -n "${PROD_ENV_FILE_B64:-}" ]; then
              echo "$PROD_ENV_FILE_B64" | base64 -d > .env.deploy.tmp

              # Only replace the live .env once the decode produced something
              # usable — a truncated or corrupt secret must not take down a
              # working deployment.
              if [ -s .env.deploy.tmp ] && grep -q '^DATABASE_URL=' .env.deploy.tmp; then
                mv .env.deploy.tmp .env
                chmod 600 .env
                echo ".env written from PROD_ENV_FILE_B64 ($(grep -c '=' .env) variables)"
              else
                rm -f .env.deploy.tmp
                echo "::error::PROD_ENV_FILE_B64 decoded to an invalid .env (empty, or no DATABASE_URL). Keeping the existing file."
                exit 1
              fi
            elif [ ! -f .env ]; then
              echo "::error::No .env on the host and PROD_ENV_FILE_B64 is not set. Refusing to deploy with placeholder config."
              exit 1
            else
              echo "PROD_ENV_FILE_B64 not set — using the .env already on the host."
            fi

            # Reclaim disk space from old tagged images (every deploy tags a
            # new web-<sha>/api-<sha> image; -a also removes unused *tagged*
            # images, not just dangling ones, so these don't pile up forever)
            docker image prune -af

            # Pull only OUR images (api/web) — the ones just built and pushed
            # under this DOCKERHUB_TOKEN's own repo. `docker compose pull` with
            # no arguments tries every service, including the third-party public
            # images (postgres, redis, nginx, minio, prometheus, grafana), and
            # those unchanged containers don't need re-pulling every deploy
            # anyway. Doing it unscoped broke here: this account's
            # DOCKERHUB_TOKEN is a repo-scoped access token, so once
            # `docker login` authenticates with it, Docker Hub refuses pulls of
            # any *other* repository — including public ones like minio/minio —
            # with a misleading "pull access denied ... may require docker
            # login" error, aborting the whole deploy before it touches a
            # container.
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull api web

            # Sync the production database schema to match this deploy's Prisma
            # schema BEFORE swapping containers over to it — otherwise new code
            # can start hitting tables/enum values that don't exist in prod yet
            # (this is what caused "create project" to 500 in production: the
            # schema had drifted since the last manual `prisma db push`).
            #
            # Deliberately no --accept-data-loss: additive/safe changes apply
            # automatically, but anything that could drop data makes this step
            # fail loudly and abort the deploy (old containers keep running)
            # instead of silently corrupting production data. If this step
            # fails, review the reported change and run the push manually with
            # --accept-data-loss only once you've confirmed what it will do.
            docker compose run --rm --no-deps api npx --yes prisma@6.14.0 db push --schema=prisma/schema

            docker compose up -d --remove-orphans

            # nginx config is bind-mounted, so compose won't restart it just
            # because the file content changed underneath it — reload explicitly
            docker compose exec -T nginx nginx -s reload

            # Verify what actually ended up running
            echo "── Running image digests ──"
            docker compose images

            # Prune unused images to optimize disk space
            docker image prune -f
